name: Tests

on:
  push:
    paths: ["container-security-scan.py", "README.md", "tests/**", ".github/workflows/tests.yml"]
    # Tags (Releases): Pfadfilter gelten dafür nicht, die Tests laufen immer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Unit-Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    # offizielle Python-Images statt setup-python: dort gibt es auch ältere Versionen (3.6 wie SLES 15)
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.6", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v

  docker:
    name: Integrationstest mit Docker
    runs-on: ubuntu-26.04
    needs: unittest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Daten (Branch daten) nach daten/ auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: daten
          path: daten
          persist-credentials: false
      - run: docker pull -q nginx:1.27-alpine && docker pull -q node:20-alpine && docker pull -q traefik:v3.3 && docker pull -q redis:7-alpine
      - run: python3 -m unittest discover -s tests -p "test_docker.py" -v
        env:
          CSS_DOCKER_TESTS: "1"

  installation:
    name: Installscript und Releases
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # alle Tags: Prüfsumme und Installscript gegen das Release prüfen
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p "test_installation.py" -v
        env:
          CSS_RELEASE_TESTS: "1"
